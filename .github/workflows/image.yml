name: image

# Publishes worker images to GHCR. Public repo + public images: builds
# are free and Fly pulls without credentials. Phoenix pins the resulting
# platform digest at dispatch time.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: smoke
            dockerfile: Dockerfile
          - variant: jdk17
            dockerfile: Dockerfile.jdk17
          - variant: jdk21
            dockerfile: Dockerfile.jdk21

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/patchwrit/patchwrit-worker
          tags: |
            type=sha
            type=raw,value=${{ matrix.variant }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
